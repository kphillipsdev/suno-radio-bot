<VirtualHost *:80>
    ServerName radio.vectorsofstars.ca
    ServerAdmin katie@katiephillips.ca

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8100/
    ProxyPassReverse / http://127.0.0.1:8100/

    ErrorLog ${APACHE_LOG_DIR}/radio-vectorsofstars-error.log
    CustomLog ${APACHE_LOG_DIR}/radio-vectorsofstars-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =radio.vectorsofstars.ca
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
